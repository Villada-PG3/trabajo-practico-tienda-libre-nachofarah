<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Libre</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e3a8a);
            color:white;
        }

        header{
            text-align:center;
            padding:80px 20px;
        }

        header h1{
            font-size:55px;
            margin-bottom:15px;
        }

        header p{
            font-size:20px;
            color:#d1d5db;
            margin-bottom:40px;
        }

        .botones{
            display:flex;
            justify-content:center;
            gap:20px;
        }

        .botones a{
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:15px 35px;
            border-radius:10px;
            transition:.3s;
            font-weight:bold;
        }

        .botones a:hover{
            background:#1d4ed8;
            transform:translateY(-3px);
        }

        section{
            max-width:1000px;
            margin:60px auto;
            display:flex;
            gap:30px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .card{
            width:280px;
            background:white;
            color:#222;
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        .card h2{
            margin-bottom:15px;
            color:#2563eb;
        }

        .card p{
            line-height:1.6;
        }

        footer{
            text-align:center;
            padding:30px;
            color:#d1d5db;
        }
    </style>

</head>
<body>

<header>

    <h1>🛒 Tienda Libre</h1>

    <p>Proyecto desarrollado con Django</p>

    <div class="botones">
        <a href="/productos/">Ver Productos</a>
        <a href="/acerca-de-mi/">Acerca de mí</a>
    </div>

</header>



<footer>

    <p>Desarrollado por Juan Ignacio Farah © 2026</p>

</footer>

</body>
</html>
