{% extends "base.html" %}

{% block titulo %}Eliminar producto | Tienda Libre{% endblock %}

{% block contenido %}
<section class="container py-5" style="max-width: 760px;">
    <div class="card border-danger shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 fw-bold text-danger mb-3">Confirmar eliminación</h1>
            <p class="mb-4">¿Estás seguro de que querés eliminar el producto <strong>{{ object.nombre }}</strong>?</p>
            <p class="text-muted">Esta acción no se puede deshacer.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger me-2">Sí, eliminar producto</button>
                <a href="{% url 'detalle_producto' object.pk %}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
